<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080c">
  <title>Halaman Tidak Ditemukan</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #8b7bff; --accent-2: #2dd4bf; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #07080c; color: #eceef5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; overflow: hidden; }
    body::before { content: ''; position: fixed; width: 520px; height: 520px; border-radius: 50%; background: var(--accent); filter: blur(120px); opacity: .25; top: -200px; left: 50%; transform: translateX(-50%); z-index: -1; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: clamp(90px, 22vw, 180px); font-weight: 500; line-height: 1; background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.05em; }
    h1 { font-size: clamp(22px, 4vw, 30px); margin: 18px 0 10px; }
    p { color: #b6bbc8; max-width: 420px; margin: 0 auto 30px; line-height: 1.7; }
    a { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 999px; background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #0a0a12; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Sepertinya halaman yang kamu cari sudah dipindahkan atau tidak pernah ada.</p>
    <a href="/">← Kembali ke beranda</a>
  </main>
</body>
</html>
